[advisories]
ignore = [
    { id = "RUSTSEC-2026-0443", reason = "Windows-only; bmcd runs on Linux. Fixed in actix-files 0.7 which changes the API" },
    { id = "RUSTSEC-2025-0141", reason = "bincode defines the persistency file format; migrating needs a format change" },
    { id = "RUSTSEC-2026-0542", reason = "humantime unmaintained; no known vulnerability" },
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; no known vulnerability" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "OpenSSL",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0"
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
version = "*"
expression = "MIT AND ISC AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

